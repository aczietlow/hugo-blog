{{ define "main" }}
{{ $books := site.Data.books }}

<div class="content">
    <article>
      <h1>{{ .Title }}</h1>
      <div class="responsive-grid">
        {{ range .Pages -}}
          {{ partial "book-excert.html" (dict 
            "page" .
            "books" $books
          )}}
        {{- end}}
      </div>
    </article>
</div>
{{ end }}
