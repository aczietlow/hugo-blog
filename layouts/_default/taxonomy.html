{{- define "main" }}
<div class="grid-inverse wrap content">
  <div>
    <h1>{{ .Title }}</h1>
    <ul class="posts">
      {{- range .Data.Terms.ByCount }}
        <li>
          <a class="post" href="{{ .Page.RelPermalink }}" title="{{ .Page.LinkTitle }}">
            <span class="post_title">{{ .Page.LinkTitle }}</span>
            <span class="post_count">{{ .Count }}</span>
          </a>
        </li>
      {{- end }}
    </ul>
  </div>
  {{- partial "sidebar" . }}
</div>
{{- end }}
