{{- define "main" }}
<div class="wrap content">
  <article class="post_content">
    <h1 class="post_title">{{ .Title }}</h1>
    {{- .Content }}
    {{ if and ( ne .Site.Params.comment false ) ( ne .Params.comment false ) }}
      {{ partial "comments" . }}
    {{ end }}
  </article>
</div>
{{- end }}
