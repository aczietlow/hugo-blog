<footer class="h-entry__footer hidden" aria-hidden="true">
  <dl>
    <dt>Permalink</dt>
    <dd>
      <a class="u-url" href="{{ .Permalink }}">{{ .Permalink }}</a>
    </dd>
    
    <dt>Summary</dt>
    <dd>
      <blockquote class="p-summary">
        {{ if .Params.summary }}
          {{ .Params.summary }}
        {{ else if .Params.abstract }}
          {{ .Params.abstract }}
        {{ else if .Summary }}
          {{ truncate 320 .Summary }}
        {{ end }}
      </blockquote>
    </dd>
    
    <dt>Canonical URL</dt>
    <dd>
      <a class="u-uid" href="{{ .Permalink }}">{{ .Permalink }}</a>
    </dd>
  </dl>
</footer>
